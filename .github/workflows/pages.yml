name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the reviewed site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/archon_horizon/frontend/package-lock.json
      - name: Install build tools
        run: |
          python -m pip install -r requirements-docs.txt
          npm --prefix src/archon_horizon/frontend ci
      - name: Check synthetic data and build site
        env:
          HORIZON_DOCS_REF: ${{ github.sha }}
        run: |
          python scripts/generate_dashboard_fixture.py --check
          python -m mkdocs build --strict
          npm --prefix src/archon_horizon/frontend run build:demo
          python scripts/assemble_docs_demo.py
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: src/archon_horizon/frontend
      - name: Check demo under a repository subpath
        run: npm --prefix src/archon_horizon/frontend run test:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # PRs and pushes only build a reviewable artifact. Publishing is an explicit
  # manual action on main, additionally subject to the github-pages environment.
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
