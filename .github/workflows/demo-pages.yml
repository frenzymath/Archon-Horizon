name: Publish Horizon demo

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'src/archon_horizon/**'
      - 'pyproject.toml'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: horizon-demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/archon_horizon/frontend/package-lock.json

      - name: Install Horizon
        run: python -m pip install -e .

      - name: Build dashboard SPA
        run: |
          npm --prefix src/archon_horizon/frontend ci
          npm --prefix src/archon_horizon/frontend run build

      - name: Export demo dashboard
        run: >-
          PYTHONPATH=src python demo/prepare_ledger.py &&
          horizon --root demo dashboard --static
          --out "$RUNNER_TEMP/horizon-demo-site"
          --dist src/archon_horizon/frontend/dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/horizon-demo-site

      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
