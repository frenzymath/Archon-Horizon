name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI checks source and packages; it has no need to push commits or publish releases.
# Give the workflow token read access to repository contents only.
permissions:
  contents: read

# A newer push supersedes checks for the same branch/PR, while other refs run
# independently. Avoid spending runners on a head reviewers will no longer merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        # Disposable CI-only credentials. Database tests create/drop isolated
        # schemas here; backup tests additionally require the development label.
        env:
          POSTGRES_USER: horizon_test
          POSTGRES_PASSWORD: horizon_test_ci
          POSTGRES_DB: horizon_pipeline_test
        ports:
          - 5432:5432
        options: >-
          --label archon-horizon.scope=pipeline-development
          --health-cmd "pg_isready -U horizon_test -d horizon_pipeline_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        # The supported Python floor and the package build version.
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Check version synchronization
        run: python scripts/version.py --check

      - name: Run tests
        env:
          HORIZON_NO_VERSION_CHECK: '1'
          HORIZON_PIPELINE_TEST_URL: postgresql+psycopg://horizon_test:horizon_test_ci@127.0.0.1:5432/horizon_pipeline_test
          HORIZON_PIPELINE_BACKUP_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: python -B -m pytest -q

  frontend:
    name: dashboard typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/archon_horizon/frontend/package-lock.json

      - name: Install
        run: npm --prefix src/archon_horizon/frontend ci

      # `vite build` does not typecheck, so run tsc explicitly: type errors
      # would otherwise ship a silently-broken dashboard. Run it from the
      # frontend dir -- `npm --prefix ... exec` does not pass flags through to
      # tsc (it prints its own help and exits 1).
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: src/archon_horizon/frontend

      - name: Build
        run: npm --prefix src/archon_horizon/frontend run build

      - name: Test
        run: npm --prefix src/archon_horizon/frontend test

      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: src/archon_horizon/frontend

      - name: Test pipeline dashboard
        run: npm --prefix src/archon_horizon/frontend run test:pipeline

  package:
    name: distribution contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/archon_horizon/frontend/package-lock.json

      # frontend/dist is gitignored, so a clean checkout has no built dashboard.
      # It must be built before the wheel, or the wheel ships without the
      # dashboard it is supposed to serve -- which is what check_wheel.py caught.
      - name: Build dashboard SPA
        run: |
          npm --prefix src/archon_horizon/frontend ci
          npm --prefix src/archon_horizon/frontend run build

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Assert the wheel ships data files and no node_modules
        run: python scripts/check_wheel.py

      - name: Assert the source archive ships rebuild inputs and no local state
        run: python scripts/check_sdist.py
