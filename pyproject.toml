[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archon-horizon"
version = "0.0.0"
description = "Workspace-first orchestration for long-horizon Lean formalization agents."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "typer>=0.12", "rich>=13", "pyfiglet>=1.0"]

[project.scripts]
horizon = "archon_horizon.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
