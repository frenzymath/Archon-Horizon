[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "archon-horizon"
dynamic = ["version"]
description = "Distributed orchestration for Lean formalization agents, projects, and review."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Axel Delaval" }]
keywords = ["lean", "lean4", "formalization", "agents", "orchestration", "mathlib"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# Runtime dependencies are selected per control-plane, worker, or client host.
dependencies = []

[project.optional-dependencies]
client = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "tenacity>=9,<10"]
control-plane = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.10,<3",
    "SQLAlchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "tenacity>=9,<10",
    "argon2-cffi>=23.1,<26",
    "PyYAML>=6,<7",
    "pybtex>=0.25,<0.26",
    "python-stdnum>=2.1,<3",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
]
pipeline-worker = [
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "tenacity>=9,<10",
    "PyYAML>=6",
]
search = ["numpy>=2", "scipy>=1.11", "bm25s>=0.2"]
dev = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.10,<3",
    "SQLAlchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "tenacity>=9,<10",
    "argon2-cffi>=23.1,<26",
    "pybtex>=0.25,<0.26",
    "python-stdnum>=2.1,<3",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "PyYAML>=6",
    "numpy>=2",
    "scipy>=1.11",
    "bm25s>=0.2",
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/frenzymath/Archon-Horizon"
Repository = "https://github.com/frenzymath/Archon-Horizon"
Changelog = "https://github.com/frenzymath/Archon-Horizon/blob/main/docs/CHANGELOG.md"
Issues = "https://github.com/frenzymath/Archon-Horizon/issues"

[project.scripts]
horizon = "archon_horizon.pipeline.cli:main"
horizon-pipeline = "archon_horizon.pipeline.cli:main"
horizon-lean-check = "archon_horizon.pipeline.worker.lean_build:main"

# include-package-data is intentionally OFF: it sweeps the whole package tree,
# which pulled hundreds of ``frontend/node_modules`` files into the wheel. We
# enumerate exactly what ships via package-data below instead.
[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
# Single source of truth: the version lives in archon_horizon.__version__.
version = { attr = "archon_horizon.__version__" }

[tool.setuptools.package-data]
# Non-.py data we ship: skill and reviewer markdown, and the built
# dashboard assets (the frontend *source* and node_modules are excluded).
"archon_horizon" = [
    "pipeline/skills/**/*.md",
    "pipeline/skills/**/scripts/*.py",
    "pipeline/subagents/**/*.md",
    "pipeline/instructions/templates/**/*.md",
    "frontend/dist/**/*",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["archon_horizon*"]
# Never treat the frontend toolchain tree as importable packages (katex ships
# loose .py build scripts that setuptools would otherwise sweep into the wheel).
exclude = ["archon_horizon.frontend*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
